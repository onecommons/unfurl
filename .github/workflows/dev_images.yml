name: Build images for GHCR
on: [push]

# id-token and attestations let actions/attest-build-provenance sign a
# provenance attestation with GitHub's OIDC identity (Sigstore), which
# `gh attestation verify` checks. BuildKit's own provenance is unsigned.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
env:
  # NOTE keep versions in sync with on_push.yml and version in TOSCA templates
  TOFU_VERSION: 1.13.1 # sync with tosca_plugins/artifacts.yaml
  TERRAFORM_VERSION: 1.5.7 # the last MPL release, for deployments that haven't migrated to OpenTofu
  HELM_VERSION: 3.7.1 # sync with configurators/helm-template.yaml
  GCLOUD_VERSION: 499.0.0 # sync with tosca_plugins/artifacts.yaml and Dockerfile
  KOMPOSE_VERSION: v1.38.0 # sync with Dockerfile and the kompose artifact in unfurl/tosca_plugins/artifacts.yaml
  KUBECTL_VERSION: v1.24.2
  K3D_VERSION: v5.8.3

# Multi-arch build strategy:
# - Each image has a matrix `*_build` job that runs once per arch on
#   a native runner (`ubuntu-latest` for amd64, `ubuntu-24.04-arm` for
#   arm64) and pushes a per-arch tag like `name:latest-amd64`.
# - A `*_manifest` job then stitches the per-arch tags into the
#   canonical (unsuffixed) tags via `docker buildx imagetools create`.
# We avoid QEMU emulation because the Rust compile in
# Dockerfile.server makes it impractically slow.

jobs:
  publish_ghcr_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Fetch repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Log in to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.arch }}
          # commit sha, branch name, tag name, latest on main
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            HELM_VERSION=${{ env.HELM_VERSION }}
            TOFU_VERSION=${{ env.TOFU_VERSION }}
            TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}
            GCLOUD_VERSION=${{ env.GCLOUD_VERSION }}
            KOMPOSE_VERSION=${{ env.KOMPOSE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

  publish_ghcr:
    runs-on: ubuntu-latest
    needs: publish_ghcr_build
    steps:
      - name: Log in to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (no arch suffix)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Create multi-arch manifest
        # Combine the per-arch tags pushed by `publish_ghcr_build` into
        # the canonical unsuffixed multi-arch tag.
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Find the multi-arch index digest
        id: index
        run: |
          tag="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Attest the multi-arch index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  publish_ghcr_server_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Fetch repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Log in to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # NOTE: a per-tag `suffix=` *replaces* `flavor.suffix`, so we
          # spell the combined `-server-<arch>` suffix inline on each
          # tag rather than using flavor.
          tags: |
            type=sha,prefix=,suffix=-server-${{ matrix.arch }}
            type=ref,event=branch,suffix=-server-${{ matrix.arch }}
            type=ref,event=tag,suffix=-server-${{ matrix.arch }}
            type=raw,value=latest,suffix=-server-${{ matrix.arch }},enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./
          file: ./docker/Dockerfile.server
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            HELM_VERSION=${{ env.HELM_VERSION }}
            TOFU_VERSION=${{ env.TOFU_VERSION }}
            TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}
            GCLOUD_VERSION=${{ env.GCLOUD_VERSION }}
            KOMPOSE_VERSION=${{ env.KOMPOSE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ghcr-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-server-${{ matrix.arch }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

  publish_ghcr_server:
    runs-on: ubuntu-latest
    needs: publish_ghcr_server_build
    steps:
      - name: Log in to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (no arch suffix)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=-server
            type=ref,event=branch,suffix=-server
            type=ref,event=tag,suffix=-server
            type=raw,value=latest,suffix=-server,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Create multi-arch manifest
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Find the multi-arch index digest
        id: index
        run: |
          tag="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Attest the multi-arch index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  publish_ghcr_server_nginx_build:
    # FROM_TAG points at the multi-arch manifest produced by
    # `publish_ghcr_server`, so each arch's build pulls the matching
    # base layer automatically and we don't need to fan out
    # per-arch FROM tags here.
    needs: publish_ghcr_server
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Fetch repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Log in to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # NOTE: a per-tag `suffix=` *replaces* `flavor.suffix`, so we
          # spell the combined `-server-cached-<arch>` suffix inline
          # on each tag rather than using flavor.
          tags: |
            type=sha,prefix=,suffix=-server-cached-${{ matrix.arch }}
            type=ref,event=branch,suffix=-server-cached-${{ matrix.arch }}
            type=ref,event=tag,suffix=-server-cached-${{ matrix.arch }}
            type=raw,value=latest,suffix=-server-cached-${{ matrix.arch }},enable={{is_default_branch}}

      - name: Extract short sha
        id: extract
        # GH's github.sha is the full ref hash, not the short one
        run: |
          echo "sha_short=$(echo "${{ github.sha }}" | head -c 7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./
          file: ./docker/Dockerfile.server-cached
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            FROM_TAG=${{ steps.extract.outputs.sha_short }}-server
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ghcr-server-cached-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-server-cached-${{ matrix.arch }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

  publish_ghcr_server_nginx:
    runs-on: ubuntu-latest
    needs: publish_ghcr_server_nginx_build
    steps:
      - name: Log in to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (no arch suffix)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=-server-cached
            type=ref,event=branch,suffix=-server-cached
            type=ref,event=tag,suffix=-server-cached
            type=raw,value=latest,suffix=-server-cached,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Create multi-arch manifest
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Find the multi-arch index digest
        id: index
        run: |
          tag="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Attest the multi-arch index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
