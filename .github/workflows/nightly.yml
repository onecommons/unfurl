name: Nightly

# What the push workflow doesn't run: the segments harness's random
# searches against SQL (they're `#[ignore]`d), and the segment bench against
# its baseline commit, refs/bench/git-sync. A schedule only runs from the
# default branch; on another branch, editing this file runs it. Run by hand,
# its inputs pick the searches, e.g.
#   gh workflow run nightly.yml --ref BRANCH -f searches="rebases upstream_merges" -f runs=4 -f bench=false

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  push:
    paths:
      - .github/workflows/nightly.yml
  workflow_dispatch:
    inputs:
      searches:
        description: Random searches to run, by name, e.g. "rebases upstream_merges"; empty runs all nine
        default: ""
      runs:
        description: Independent runs of each search, per backend, each on its own runner (1-20)
        default: "1"
      backends:
        description: Backends to search on
        type: choice
        options: [both, sqlite, postgres]
        default: both
      cases:
        description: Cases per random search, per run
        default: "200"
      rng_seed:
        description: Fixed proptest RNG seed, to replay a run (every run is then the same); empty for random
        default: ""
      shape_checks:
        description: Also check chain lengths and draft entries, which no read sees
        type: boolean
        default: true
      bench:
        description: Also time the segment bench against refs/bench/git-sync
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the search jobs' matrix: each backend, each run
  plan:
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.plan.outputs.backends }}
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - id: plan
        env:
          BACKENDS: ${{ inputs.backends || 'both' }}
          RUNS: ${{ inputs.runs || '1' }}
        run: |
          case "$BACKENDS" in
            both) echo 'backends=["sqlite","postgres"]' ;;
            sqlite | postgres) echo "backends=[\"$BACKENDS\"]" ;;
            *) echo "no backend $BACKENDS" >&2; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 20 ]; then
            echo "runs must be 1 to 20, not $RUNS" >&2
            exit 1
          fi
          echo "runs=[$(seq 1 "$RUNS" | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  segments:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.plan.outputs.backends) }}
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    env:
      BACKEND: ${{ matrix.backend }}
      # a scheduled or pushed run has no inputs: all nine, shape checks on
      SEARCHES: ${{ inputs.searches || '' }}
      SHAPE_CHECKS: ${{ inputs.shape_checks || github.event_name != 'workflow_dispatch' }}
      PROPTEST_CASES: ${{ inputs.cases || '200' }}
      RNG_SEED: ${{ inputs.rng_seed || '' }}
      UNFURL_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/unfurl_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install and start postgres
        if: matrix.backend == 'postgres'
        # without durability: a commit stops waiting for the disk, which
        # only a crash could tell from durable; the bench keeps its own
        run: |
          sudo apt-get update -y
          sudo apt install -y postgresql
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE unfurl_test;"
          sudo -u postgres psql -c "ALTER SYSTEM SET fsync = off;" \
            -c "ALTER SYSTEM SET synchronous_commit = off;" \
            -c "ALTER SYSTEM SET full_page_writes = off;" -c "SELECT pg_reload_conf();"
      - name: Configure git
        run: |
          git config --global user.email "unittest@onecommons.org"
          git config --global user.name "Test Robot"
          git config --global init.defaultBranch main
      - name: Run the random searches
        run: |
          if [ "$BACKEND" = postgres ]; then export SEGMENTS_SQL_PG=1; fi
          if [ "$SHAPE_CHECKS" != true ]; then export SEGMENTS_VISIBLE_ONLY=1; fi
          if [ -n "$RNG_SEED" ]; then export PROPTEST_RNG_SEED=$RNG_SEED; fi
          harness=(cargo test --manifest-path rust/Cargo.toml -p unfurl-git-sync --features postgres
            --test segments_sql --)
          # SEARCHES split on spaces and commas: empty, every search
          read -ra wanted <<<"${SEARCHES//,/ }"
          names=$("${harness[@]}" --ignored --list | rust/dev/git-sync-searches.sh "${wanted[@]}")
          mapfile -t tests <<<"$names"
          echo "searches: ${tests[*]}"
          "${harness[@]}" --ignored --exact "${tests[@]}"
      - name: Upload the seeds it failed on
        # proptest saves each failing case's seed to the regressions file;
        # someone decides whether it's a known bug, a new one or the harness
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-regressions-${{ matrix.backend }}-${{ matrix.run }}
          path: rust/git-sync/tests/*.proptest-regressions

  bench:
    # a scheduled or pushed run has no inputs: the bench runs
    if: github.event_name != 'workflow_dispatch' || inputs.bench
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      # the bench's planner costs are JIT-on Postgres 17's, as in production
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pgjit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BENCH_PG_URL: postgres://postgres:pgjit@localhost:5432
      RUNS: "3"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - name: Check out the baseline
        # HEAD is timed against this commit on the same machine; to move it,
        # git push --force origin <commit>:refs/bench/git-sync
        run: |
          git fetch --no-tags --depth=1 origin refs/bench/git-sync
          git worktree add --detach base FETCH_HEAD
          git -C base log --oneline -1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install psql
        run: command -v psql || { sudo apt-get update -y && sudo apt-get install -y postgresql-client; }
      - name: Record the machine
        run: lscpu | tee lscpu.txt
      - name: Build HEAD and the baseline
        run: |
          for root in . base; do
            cargo test --release --manifest-path "$root/rust/Cargo.toml" -p unfurl-git-sync \
              --features postgres --lib --no-run
          done
      - name: Run the bench
        # each run on a fresh database from its own side's migrations and
        # generate.sql; the sides alternate which goes first, so the
        # machine's drift falls on both; "500" is bench/segments/README.md's
        run: |
          python3 -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
          side() {
            local name=$1 root=$2 fam=$3
            shift 3
            "$root/rust/git-sync/bench/segments/run.sh" generate "$@"
            BENCH_FAMILY=$fam BENCH_JSON="$PWD/$name-$fam-$i.jsonl" cargo test --release \
              --manifest-path "$root/rust/Cargo.toml" -p unfurl-git-sync --features postgres \
              --lib bench_segments -- --ignored --test-threads=1 --nocapture \
              > "$name-$fam-$i.log" 2>&1 || { tail -50 "$name-$fam-$i.log"; exit 1; }
          }
          family() {
            for i in $(seq "$RUNS"); do
              if [ $((i % 2)) = 1 ]; then
                side base base "$@"; side head . "$@"
              else
                side head . "$@"; side base base "$@"
              fi
            done
          }
          family 20k
          family 500 records=500 types=20 main_segments=10 forks=3 fork_edits=10 \
            fork_draft_edits=2 users=10 user_edits=5 main_draft_edits=5
      - name: Compare with the baseline
        run: |
          python3 rust/git-sync/bench/segments/compare.py rust/git-sync/bench/segments/limits.json \
            --base base-*.jsonl --head head-*.jsonl --cpu lscpu.txt
      - name: Upload the numbers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: |
            head-*.jsonl
            base-*.jsonl
            head-*.log
            base-*.log
            lscpu.txt
