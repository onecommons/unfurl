name: Random property tests

# The segments harness's random searches against SQL, which the push
# workflow skips (they're `#[ignore]`d). A schedule only runs from the
# default branch; on another branch, editing this file runs it.

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  push:
    paths:
      - .github/workflows/proptests.yml
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per random search
        default: "200"
      shape_checks:
        description: Also check chain lengths and draft entries, which no read sees
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: proptests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segments:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    env:
      BACKEND: ${{ matrix.backend }}
      SHAPE_CHECKS: ${{ inputs.shape_checks }}
      PROPTEST_CASES: ${{ inputs.cases || '200' }}
      UNFURL_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/unfurl_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install and start postgres
        if: matrix.backend == 'postgres'
        run: |
          sudo apt-get update -y
          sudo apt install -y postgresql
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE unfurl_test;"
      - name: Configure git
        run: |
          git config --global user.email "unittest@onecommons.org"
          git config --global user.name "Test Robot"
          git config --global init.defaultBranch main
      - name: Run the random searches
        run: |
          if [ "$BACKEND" = postgres ]; then export SEGMENTS_SQL_PG=1; fi
          if [ "$SHAPE_CHECKS" != true ]; then export SEGMENTS_VISIBLE_ONLY=1; fi
          cargo test --manifest-path rust/Cargo.toml -p unfurl-git-sync --features postgres \
            --test segments_sql -- --ignored
      - name: Upload the seeds it failed on
        # proptest saves each failing case's seed to the regressions file;
        # someone decides whether it's a known bug, a new one or the harness
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-regressions-${{ matrix.backend }}
          path: rust/git-sync/tests/*.proptest-regressions
