[package]
name = "unfurl-git-sync"
version = "0.1.0"
edition = "2021"
# Set by `saphyr`, the deepest MSRV in this crate's tree.
rust-version = "1.85"
authors = ["Adam Souzis <adam@souzis.com>"]
license = "MIT"
description = "Sync JSON/YAML data tracked in a git repository with SQLite or Postgres."
homepage = "https://github.com/onecommons/unfurl"
repository = "https://github.com/onecommons/unfurl"

[lib]
name = "unfurl_git_sync"
path = "src/lib.rs"

[features]
# SQLite support is always compiled in (it's the simple default backend).
# Postgres is opt-in via this feature flag.
default = []
postgres = ["sqlx/postgres"]
# Compatibility alias so callers can still write `--features sqlite` —
# SQLite is always built in, this is a no-op flag.
sqlite = []

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "chrono",
    "sqlite",
] }
gix = { version = "0.66", default-features = false, features = ["max-performance-safe", "index", "blob-diff", "revision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.1.0"
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tempfile = "3"
# Used at runtime by code generated from cloudmap-schema.json by
# `typify` — pattern-validated string types compile to `regress::Regex`
# constructors.
regress = "0.10"
json5 = "1.3.1"
saphyr = "0.0.12"

[build-dependencies]
# Generates Rust types from `unfurl/cloudmap/cloudmap-schema.json` so
# the cloudmap format walker can deserialize records into typed
# structs instead of indexing raw JSON by string. The build script
# shells out to `rustfmt` for formatting (which ships in rustup's
# default profile); see `build.rs` for the fallback when it's missing.
typify = { version = "0.7", default-features = false }
schemars = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
