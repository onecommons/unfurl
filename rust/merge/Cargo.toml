[package]
name = "unfurl-merge"
version = "0.1.0"
edition = "2021"
# Set by `saphyr` and `hashbrown`, the deepest MSRVs in this crate's
# tree.
rust-version = "1.85"
authors = ["Adam Souzis <adam@souzis.com>"]
license = "MIT"
description = "Deep-merge engine for YAML/JSON with file include directives and source provenance. Rust port of unfurl/merge.py."
homepage = "https://github.com/onecommons/unfurl"
repository = "https://github.com/onecommons/unfurl"

[lib]
name = "unfurl_merge"
path = "src/lib.rs"

[dependencies]
saphyr = "0.0.12"
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
