[package]
name = "unfurl-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Adam Souzis <adam@souzis.com>"]
license = "MIT"
description = "Rust HTTP proxy server for unfurl"
homepage = "https://github.com/onecommons/unfurl"
repository = "https://github.com/onecommons/unfurl"

[features]
default = []
postgres = ["unfurl-git-sync/postgres"]

[lib]
name = "unfurl_server"
path = "src/lib.rs"

[[bin]]
name = "unfurl-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
redis = { version = "0.27", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["trace", "cors"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde-pickle = "1"
url = "2"
http = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
once_cell = "1"
regress = "0.10"
uuid = { version = "1", features = ["serde"] }
unfurl-git-sync = { path = "../git-sync", default-features = false }
# Runtime support deps for the oas3-gen-generated `unfurl_types.rs`
# (see `build.rs`).
oas3-gen-support = "0.25"
serde_with = "3"
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
serde-saphyr = "0.0.25"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
